services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentreadiness}
      POSTGRES_USER: ${POSTGRES_USER:-agentreadiness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentreadiness}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentreadiness}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      DEV_EMAIL_SHORTCUT_ENABLED: ${DEV_EMAIL_SHORTCUT_ENABLED:-false}
      DEV_ACCESS_EMAIL: ${DEV_ACCESS_EMAIL:-}
      CUSTOMER_MODE_ENABLED: ${CUSTOMER_MODE_ENABLED:-true}
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:-}
      VERIFICATION_COOKIE_SECURE: ${VERIFICATION_COOKIE_SECURE:-true}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_LIVE_MODE: ${STRIPE_LIVE_MODE:-false}
      PAID_REPORT_DAYS: ${PAID_REPORT_DAYS:-365}
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-20}
      CRAWL_MAX_DEPTH: ${CRAWL_MAX_DEPTH:-3}
      CRAWL_REQUEST_TIMEOUT: ${CRAWL_REQUEST_TIMEOUT:-10}
      CRAWL_MAX_REDIRECTS: ${CRAWL_MAX_REDIRECTS:-5}
      CRAWL_SITEMAP_ENTRIES: ${CRAWL_SITEMAP_ENTRIES:-500}
      CRAWL_SITEMAP_DEPTH: ${CRAWL_SITEMAP_DEPTH:-3}
      CRAWL_HTML_BYTES: ${CRAWL_HTML_BYTES:-2097152}
      CRAWL_SITEMAP_BYTES: ${CRAWL_SITEMAP_BYTES:-2097152}
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-3}
      CRAWL_DURATION: ${CRAWL_DURATION:-300}
      CRAWL_MIN_DELAY: ${CRAWL_MIN_DELAY:-0.1}
      SCAN_DURATION: ${SCAN_DURATION:-120}
      SCAN_MAX_ACTIVE: ${SCAN_MAX_ACTIVE:-2}
      SCAN_QUEUE_LIMIT: ${SCAN_QUEUE_LIMIT:-30}
      SCAN_QUEUE_WAIT: ${SCAN_QUEUE_WAIT:-600}
      AUDIT_RENDER_PAGES: ${AUDIT_RENDER_PAGES:-3}
      AUDIT_RENDER_TIMEOUT: ${AUDIT_RENDER_TIMEOUT:-8}
      AUDIT_BROWSER_ENABLED: ${AUDIT_BROWSER_ENABLED:-true}
      AUDIT_RESOURCE_LIMIT: ${AUDIT_RESOURCE_LIMIT:-5}
      AUDIT_DIAGNOSTICS_TIMEOUT: ${AUDIT_DIAGNOSTICS_TIMEOUT:-15}
      AUDIT_MISSING_PATH_ENABLED: ${AUDIT_MISSING_PATH_ENABLED:-true}
      REPORT_SHARE_DAYS: ${REPORT_SHARE_DAYS:-7}
      CRAWL_USER_AGENT: ${CRAWL_USER_AGENT:-AgentReadinessBot/0.1}
      CRAWL_ALLOW_SUBDOMAINS: ${CRAWL_ALLOW_SUBDOMAINS:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_TOKENS: ${HF_TOKENS:-}
      OSAURUS_API_KEY: ${OSAURUS_API_KEY:-}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-osaurus}
      AGENT_MODEL: ${AGENT_MODEL:-raptor-0.6-4b-jang_6m}
      AGENT_LLM_MODE: ${AGENT_LLM_MODE:-local}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-http://host.docker.internal:1337/v1}
      AGENT_LLM_TIMEOUT: ${AGENT_LLM_TIMEOUT:-60}
      AGENT_LLM_RETRIES: ${AGENT_LLM_RETRIES:-2}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-700}
      AGENT_INVALID_LIMIT: ${AGENT_INVALID_LIMIT:-3}
      AGENT_OBSERVATION_CHARS: ${AGENT_OBSERVATION_CHARS:-12000}
      AGENT_MAX_ELEMENTS: ${AGENT_MAX_ELEMENTS:-150}
      AGENT_REQUEST_LIMIT: ${AGENT_REQUEST_LIMIT:-150}
      AGENT_MAX_REDIRECTS: ${AGENT_MAX_REDIRECTS:-5}
      AGENT_SCREENSHOTS: ${AGENT_SCREENSHOTS:-true}
      AGENT_STRUCTURED_OUTPUT: ${AGENT_STRUCTURED_OUTPUT:-false}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-15}
      AGENT_DURATION: ${AGENT_DURATION:-90}
      AGENT_BROWSER_EXECUTABLE: ${AGENT_BROWSER_EXECUTABLE:-}
      AGENT_PIPELINE_ENABLED: ${AGENT_PIPELINE_ENABLED:-false}
      AGENT_RUNS_PER_TASK: ${AGENT_RUNS_PER_TASK:-2}
      AGENT_FREE_LIMITS_ENABLED: ${AGENT_FREE_LIMITS_ENABLED:-true}
      AGENT_FREE_TASK_LIMIT: ${AGENT_FREE_TASK_LIMIT:-2}
      AGENT_FREE_RUNS_PER_TASK: ${AGENT_FREE_RUNS_PER_TASK:-1}
      AGENT_TOKEN_BUDGET: ${AGENT_TOKEN_BUDGET:-32768}
      AGENT_ACTION_DELAY: ${AGENT_ACTION_DELAY:-1}
      AGENT_JUDGE_ENABLED: ${AGENT_JUDGE_ENABLED:-true}
      AGENT_SCORE_WEIGHT: ${AGENT_SCORE_WEIGHT:-0.45}
      AGENT_INPUT_COST_PER_MILLION: ${AGENT_INPUT_COST_PER_MILLION:-}
      AGENT_OUTPUT_COST_PER_MILLION: ${AGENT_OUTPUT_COST_PER_MILLION:-}
      AGENT_STAGE_DURATION: ${AGENT_STAGE_DURATION:-600}
      AGENT_MAX_ACTIVE: ${AGENT_MAX_ACTIVE:-2}
      AGENT_IP_WINDOW_SECONDS: ${AGENT_IP_WINDOW_SECONDS:-3600}
      AGENT_IP_SCAN_LIMIT: ${AGENT_IP_SCAN_LIMIT:-10}
      AGENT_IP_TASK_LIMIT: ${AGENT_IP_TASK_LIMIT:-20}
      AGENT_TRUSTED_PROXY_CIDRS: ${AGENT_TRUSTED_PROXY_CIDRS:-[]}
      AGENT_SCREENSHOT_DIR: /app/artifacts/agent
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - ./backend/artifacts:/app/artifacts
    command: ["sh", "-c", ".venv/bin/alembic upgrade head && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 20
  demo-store:
    # Fictional store with deliberate agent problems; the edge router's demo origin.
    build: ./demo-store
    ports:
      - "127.0.0.1:${DEMO_STORE_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/robots.txt', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  edge:
    # Edge router: reuses the backend image (no second build), separate entry point.
    # See docs/agentlane-mvp.md.
    image: saagentics-backend
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentreadiness}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentreadiness}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:-}
      # Local development only: lets sites point at the demo store on the Docker network.
      EDGE_ALLOW_PRIVATE_ORIGINS: ${EDGE_ALLOW_PRIVATE_ORIGINS:-true}
      EDGE_UPSTREAM_TIMEOUT: ${EDGE_UPSTREAM_TIMEOUT:-30}
      AGENT_TRUSTED_PROXY_CIDRS: ${AGENT_TRUSTED_PROXY_CIDRS:-[]}
      # Variant builds (python -m app.cli.variants build) run here and call Gemini.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_LLM_PROVIDER: ${EDGE_LLM_PROVIDER:-gemini}
      AGENT_MODEL: ${EDGE_MODEL:-gemini-3.8-flash}
      AGENT_LLM_BASE_URL: ${EDGE_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      VARIANT_MAX_PAGES: ${VARIANT_MAX_PAGES:-50}
    ports:
      - "127.0.0.1:${EDGE_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
      demo-store:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: [".venv/bin/uvicorn", "app.edge.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/_agentlane/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
